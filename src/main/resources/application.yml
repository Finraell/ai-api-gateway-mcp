spring:
  application:
    name: ai-api-gateway-mcp
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:ai_gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  ai:
    mcp:
      server:
        enabled: ${SPRING_AI_MCP_ENABLED:true}
        name: ai-api-gateway-risk-mcp-server
        version: 0.1.0
        instructions: Exposes deterministic, audit-friendly financial risk decisioning tools through stateless Streamable HTTP MCP. No LLM provider API key is required to run this MCP server.
        type: SYNC
        protocol: STATELESS
        annotation-scanner:
          enabled: true
        stateless:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

server:
  port: 8080

# In Docker, management endpoints move to 8081 and are scraped only from the Compose network.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

gateway:
  security:
    api-key: ${GATEWAY_API_KEY:local-dev-key}
    api-key-enabled: ${GATEWAY_API_KEY_ENABLED:true}
    jwt:
      enabled: ${GATEWAY_JWT_ENABLED:false}
      hmac-secret: ${GATEWAY_JWT_HMAC_SECRET:local-jwt-demo-secret-change-me}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:120}
  risk:
    model-version: rules-2026.05
  events:
    enabled: ${RISK_EVENTS_ENABLED:false}
    topic: risk.decision.created

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.dsushkov.aiapigateway: INFO
